    <!--
      Import map: permite usar bare specifiers en el navegador sin bundler.
      'lit' se resuelve a la URL del CDN en lugar de /node_modules.
    -->
    <script type="importmap">
      {
        "imports": {
          "lit": "https://esm.run/lit@3",
          "lit/": "https://esm.run/lit@3/"
        }
      }
    </script>
  </head>
