<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>02-05 — Eventos</title>
    <script type="importmap">
      {
        "imports": {
          "lit": "https://esm.run/lit@3",
          "lit/": "https://esm.run/lit@3/"
        }
      }
    </script>
    <style>
      body { font-family: system-ui, sans-serif; padding: 2rem; }
    </style>
  </head>
  <body>
    <h1>Eventos en LitElement</h1>
    <p>El componente padre (<code>rating-form</code>) escucha eventos del hijo (<code>rating-stars</code>).</p>

    <rating-form></rating-form>

    <!-- Verificar que el evento también burbujea hasta el documento -->
    <script>
      document.addEventListener('rating-change', (e) => {
        console.info('[document] rating-change recibido:', e.detail);
      });
    </script>

    <script type="module" src="./rating-stars.js"></script>
    <script type="module" src="./rating-form.js"></script>
  </body>
</html>
